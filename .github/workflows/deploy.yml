name: Deploy to Vercel

# The Vercel project is not connected to this repo (it was created with the
# Vercel CLI), so pushing to main does not deploy on its own. This workflow is
# that missing link: every push to main builds and ships to production.
#
# Setup is ONE repository secret:
#   VERCEL_TOKEN  - create at https://vercel.com/account/tokens, then add it at
#                   Settings > Secrets and variables > Actions > New repository secret
#
# The org and project ids are NOT secrets and are not needed here - the token
# can look them up. Override the project name with a `VERCEL_PROJECT_NAME`
# repository variable if the Vercel project is ever renamed.

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main from the Actions tab without a push.
  workflow_dispatch:

# Never let two production deploys race; the newest push wins.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'greenlite-fantasy-2026' }}
    steps:
      - uses: actions/checkout@v4

      # Fail loudly with the fix, rather than a confusing CLI error later.
      - name: Check Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN. Create a token at https://vercel.com/account/tokens, then add it under Settings > Secrets and variables > Actions as VERCEL_TOKEN."
            exit 1
          fi

      # The ids the Vercel CLI needs are readable from the token, so nobody has
      # to run `vercel link` or paste them in by hand.
      - name: Resolve Vercel project
        run: |
          resp=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_NAME")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')

          if [ "$code" != "200" ]; then
            echo "::error::Could not find Vercel project '$PROJECT_NAME' (HTTP $code)."
            echo "Projects this token can see:"
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects" \
              | jq -r '.projects[]?.name | "  - \(.)"' || true
            echo "Set a VERCEL_PROJECT_NAME repository variable if the name differs."
            exit 1
          fi

          # Ids, not secrets - safe to log so a wrong-project deploy is obvious.
          echo "VERCEL_PROJECT_ID=$(echo "$body" | jq -r .id)" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$(echo "$body" | jq -r .accountId)" >> "$GITHUB_ENV"
          echo "Deploying project '$(echo "$body" | jq -r .name)' ($(echo "$body" | jq -r .id))"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      # Build here rather than on Vercel, so a broken build fails this workflow.
      - name: Build project artifacts
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production
        run: |
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          {
            echo "### Deployed to production"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
