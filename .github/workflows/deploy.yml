name: Deploy to Vercel

# The Vercel project is not connected to this repo (it was created with the
# Vercel CLI), so pushing to main does not deploy on its own. This workflow is
# that missing link: every push to main builds and ships to production.
#
# One-time setup - add three repository secrets under
# Settings -> Secrets and variables -> Actions:
#   VERCEL_TOKEN       vercel.com/account/tokens (or `vercel tokens add`)
#   VERCEL_ORG_ID      from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  from the same file
# (.vercel is gitignored, so read the ids there and paste them in.)

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main from the Actions tab without a push.
  workflow_dispatch:

# Never let two production deploys race; the newest push wins.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail loudly with the fix, rather than a confusing CLI error later.
      - name: Check Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          if [ -z "$VERCEL_TOKEN" ]; then missing="$missing VERCEL_TOKEN"; fi
          if [ -z "$VERCEL_ORG_ID" ]; then missing="$missing VERCEL_ORG_ID"; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then missing="$missing VERCEL_PROJECT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing - add them under Settings > Secrets and variables > Actions. See the comments at the top of .github/workflows/deploy.yml."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build here rather than on Vercel, so a broken build fails this workflow.
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $url"
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
